# Secret Server provider - Delinea (formerly Thycotic) Secret Server
display_name = "Secret Server"
serde_rename = "secretserver"
rust_variant = "SecretServer"
category = "PasswordManager"
description = "Delinea Secret Server (Thycotic)"
default_name = "ss"

setup_instructions = """
Retrieves secrets from Delinea Secret Server via REST API.
Uses token-based authentication. Generate a token and set it as an environment variable or in config."""

[fields.base_url]
type = "required"
placeholder = "https://secretserver.example.com/"
label = "Base URL:"
wizard = true

[fields.token]
type = "required"
placeholder = ""
label = "API Token:"
wizard = true
